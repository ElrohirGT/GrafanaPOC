---
multitenancyEnabled: false
streamOverHTTPEnabled: true

traces:
  otlp:
    http:
      enabled: true
    grpc:
      enabled: true

storage:
  trace:
    backend: s3
    s3:
      bucket: tempo-traces
      endpoint: minio.monitoring.svc.cluster.local:9000
      access_key: admin
      secret_key: password123
      insecure: true

ingester:
  replicas: 2  # 2 is the minimum! It doesn't work with 1
  zoneAwareReplication:
    enabled: false

metricsGenerator:
  enabled: true
  replicas: 1

distributor:
  replicas: 1
  config:
    log_received_spans:
      enabled: true
    log_discarded_spans:
      enabled: true

compactor:
  replicas: 1

querier:
  replicas: 1

query-frontend:
  replicas: 1

tempoQuery:
  enabled: true

minio:
  enabled: false

gateway:
  enabled: true
  service:
    type: ClusterIP
