---
multitenancyEnabled: false

storage:
  trace:
    backend: s3
    s3:
      bucket: tempo-traces
      endpoint: minio.monitoring.svc.cluster.local:9000
      access_key: admin
      secret_key: password123
      insecure: true

ingester:
  replicas: 1

metricsGenerator:
  enabled: true
  replicas: 1

distributor:
  replicas: 1

compactor:
  replicas: 1

querier:
  replicas: 1

query-frontend:
  replicas: 1

tempoQuery:
  enabled: true

minio:
  enabled: false

gateway:
  enabled: true
