---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-sources-conf
  labels:
    name: grafana-sources-conf
  namespace: monitoring

data:
  datasources.yaml: |-
    datasources:
      - name: Prometheus
        type: prometheus
        url: "http://prometheus.test:8080"
      - name: Loki
        type: loki
        url: "http://loki-gateway.loki:80"
        jsonData:
          httpHeaderName1: "X-Scope-OrgID"
        secureJsonData:
          httpHeaderValue1: "Tribal"
      - name: Jaeger
        type: jaeger
        url: "http://jaeger-inmemory-instance-collector.test:16686"
      - name: Tempo
        type: tempo
        jsonData:
          httpHeaderName1: "X-Scope-OrgID"
        secureJsonData:
          httpHeaderValue1: "Tribal"
        url: "http://tempo-simplest-query-frontend.test:16687"
