---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: grafana
  name: grafana
  namespace: monitoring
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '9100'
    profiles.grafana.com/cpu.scrape: 'true'
    profiles.grafana.com/cpu.port: '8080'
    profiles.grafana.com/memory.scrape: 'true'
    profiles.grafana.com/memory.port: '8080'
    profiles.grafana.com/goroutine.scrape: 'true'
    profiles.grafana.com/goroutine.port: '8080'
spec:
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      namespace: monitoring
      annotations:
        prometheus.io/scrape: 'true'
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        supplementalGroups:
          - 0
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_PLUGINS_PREINSTALL_SYNC
              value: grafana-pyroscope-app
            # - name: GF_AUTH_ANONYMOUS_ENABLED
            #   value: 'true'
            # - name: GF_AUTH_ANONYMOUS_ORG_ROLE
            #   value: Admin
            # - name: GF_DIAGNOSTICS_PROFILING_ENABLED
            #   value: 'true'
            # - name: GF_DIAGNOSTICS_PROFILING_ADDR
            #   value: 0.0.0.0
            # - name: GF_DIAGNOSTICS_PROFILING_PORT
            #   value: 8080
          ports:
            - containerPort: 3000
              name: http-grafana
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /robots.txt
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 2
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 3000
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 250m
              memory: 750Mi
          volumeMounts:
            - mountPath: /var/lib/grafana
              name: grafana-pv
            - mountPath: /etc/grafana/provisioning/datasources/
              name: grafana-config-volume
            - mountPath: /etc/grafana/provisioning/dashboards/
              name: grafana-dashboards-volume
            - mountPath: /etc/grafana/provisioning/alerting/
              name: grafana-alerts-volume
      volumes:
        - name: grafana-alerts-volume
          configMap:
            defaultMode: 420
            name: grafana-alerts-conf
        - name: grafana-dashboards-volume
          configMap:
            defaultMode: 420
            name: grafana-dashboards-conf
        - name: grafana-config-volume
          configMap:
            defaultMode: 420
            name: grafana-sources-conf
        - name: grafana-pv
          persistentVolumeClaim:
            claimName: grafana-pvc
