---
loki:
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  pattern_ingester:
    enabled: true
  auth_enabled: false
  limits_config:
    # allow_structured_metadata: true
    volume_enabled: true
  ruler:
    enable_api: true
  # storage_config:
  #   aws:
  #     s3: http://admin:password123@minio.monitoring.svg.cluster.local:9000
  #     s3forcepathstyle: true
  storage:
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin
    type: s3
    s3:
      endpoint: "http://admin:password123@minio.monitoring.svc.cluster.local:9000"
    object_storage:
      type: s3
      s3:
        endpoint: "http://admin:password123@minio.monitoring.svc.cluster.local:9000"
  ingester:
    chunk_encoding: snappy
  querier:
    # Default is 4, if you have enough memory and CPU you can increase, reduce if OOMing
    max_concurrent: 4

deploymentMode: Distributed

minio:  # Minio subchart...
  enabled: false

# singleBinary:
#   replicas: 1


ingester:
  replicas: 1
querier:
  replicas: 1  # Improve query performance via parallelism
  maxUnavailable: 1
queryFrontend:
  replicas: 1
  maxUnavailable: 1
queryScheduler:
  replicas: 1
distributor:
  replicas: 1
  maxUnavailable: 1
compactor:
  replicas: 1
indexGateway:
  replicas: 1
  maxUnavailable: 1

# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0

singleBinary:
  replicas: 0

gateway:
  enabled: true
  service:
    type: ClusterIP
